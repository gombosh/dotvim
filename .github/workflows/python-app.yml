# This workflow will install dependencies and test the Neovim configuration
name: Neovim Configuration Test

on:
  push:
    branches: [ "master", "lua-migration" ]
  pull_request:
    branches: [ "master", "lua-migration" ]

permissions:
  contents: read

jobs:
  test-config:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Neovim and dependencies
      run: |
        sudo add-apt-repository ppa:neovim-ppa/stable
        sudo apt-get update
        sudo apt-get install -y neovim fzf ripgrep fd-find

    - name: Set up configuration
      run: |
        mkdir -p $HOME/.config/nvim
        cp -r . $HOME/.config/nvim/

    - name: Test Neovim headless startup and plugin installation
      run: |
        # Run nvim in headless mode to trigger lazy.nvim plugin installation
        # We use a timeout to ensure it doesn't hang if there's an interactive prompt
        timeout 300s nvim --headless "+Lazy! sync" +qa || true

        # Verify that nvim can start without errors after sync
        nvim --headless +qa
